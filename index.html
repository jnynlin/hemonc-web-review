<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>血液腫瘤科 官網特色醫療 刊登內容覆核</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600&display=swap">
<style>
:root{
  --bg:#f5f6f3; --surface:#ffffff; --surface2:#eef1ec; --line:#d6dcd4;
  --ink:#1e2b33; --muted:#5f6f78; --accent:#1d6f78; --accent-ink:#ffffff;
  --ok:#2f7d4e; --ok-bg:#e3f1e8; --obj:#b0413e; --obj-bg:#f8e3e2; --wait:#8a979e; --wait-bg:#eef1f2; --lead:#8a5a00; --lead-bg:#fbf1dc;
  --shadow:0 1px 2px rgba(20,35,45,.06);
}
@media (prefers-color-scheme: dark){
  :root{ color-scheme:dark;
    --bg:#131a1e; --surface:#1b2429; --surface2:#222d33; --line:#33414a; --ink:#e5ebee; --muted:#9aacb5;
    --accent:#4fb3bd; --accent-ink:#0f1a1d; --ok:#5fc38a; --ok-bg:#1b3a2a; --obj:#e07a76; --obj-bg:#44231f; --wait:#8a979e; --wait-bg:#263036; --lead:#e0a93e; --lead-bg:#3a2f16; --shadow:none; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:17px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 64px;display:grid;gap:18px}
h1{font-family:"Noto Serif TC","Noto Sans TC",serif;font-weight:600;font-size:clamp(23px,3.2vw,30px);margin:0;line-height:1.25}
h2{font-size:18px;margin:0;font-weight:700}
h3{font-size:16px;margin:0 0 6px;font-weight:700}
.sub{color:var(--muted);font-size:15px;margin:4px 0 0}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px;box-shadow:var(--shadow)}
.card.how{border-left:5px solid var(--accent);font-size:15px}
.card.how b{color:var(--accent)}
.banner{background:var(--obj-bg);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:15px}
.banner.ok{background:var(--ok-bg)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;box-shadow:var(--shadow)}
.stat .lab{font-size:13px;color:var(--muted)} .stat .val{font-size:26px;font-weight:700;line-height:1.1}
.stat.dl .val{color:var(--accent)}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:18px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
.left{display:grid;gap:14px;min-width:0}
.right{display:grid;gap:14px;position:sticky;top:12px}
@media (max-width:900px){.right{position:static}}
section.sec{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
.shead{padding:10px 16px;background:var(--surface2);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.shead .r{font-size:13px;color:var(--muted)}
.leadtag{display:inline-block;font-size:13px;font-weight:700;padding:2px 9px;border-radius:10px;background:var(--lead-bg);color:var(--lead)}
.item{padding:14px 16px;border-top:1px solid var(--line);display:grid;gap:8px}
.item:first-of-type{border-top:0}
.code{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.txt{font-size:16px}
.src{font-size:13px;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-size:15px;font-weight:700;border:1px solid var(--line);border-radius:6px;padding:9px 14px;cursor:pointer;background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ok{color:var(--ok)} .btn.obj{color:var(--obj)}
.btn.sm{font-size:14px;padding:7px 12px}
.btn.ok.done{background:var(--ok-bg);border-color:var(--ok)}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tally{display:flex;gap:6px;flex-wrap:wrap;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;background:var(--wait-bg);color:var(--wait)}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.obj{background:var(--obj-bg);color:var(--obj)}
textarea.note{width:100%;font:inherit;font-size:15px;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--surface);color:var(--ink);min-height:44px;resize:vertical}
.resp{font-size:14px;border-left:3px solid var(--line);padding-left:10px;color:var(--muted)}
.resp.obj{border-left-color:var(--obj);color:var(--ink)}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.name{font:inherit;font-size:16px;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:12px 8px;background:var(--surface);color:var(--ink);cursor:pointer;text-align:center;display:grid;gap:2px}
.name small{font-size:12px;color:var(--muted);font-weight:400}
.name.done{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.name.done small{color:var(--ok)}
.name.lead{border-color:var(--lead)}
.confirm{display:grid;gap:8px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:12px}
.confirm .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.other{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.other input{font:inherit;font-size:15px;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--surface);color:var(--ink);width:140px}
.who{font-size:13px;color:var(--muted)}
table.stat{border-collapse:collapse;width:100%;font-size:14px}
table.stat th,table.stat td{text-align:left;padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
table.stat th{font-size:12px;color:var(--muted);letter-spacing:.04em;border-top:0}
.pending{color:var(--muted)}
.foot{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>官網特色醫療 刊登內容覆核 血液腫瘤科</h1>
    <p class="sub">10/21(三)中午前未表示異議的項目,視為同意刊登。今天 <span id="today" class="num"></span></p>
  </header>

  <div class="card how" id="how"><b>怎麼用</b>:左半部是將刊登的文字,各段標示主負責人,由主負責人逐項按「確認無誤」或「有異議」。右半部是全科同仁名單,看完後點自己的名字一次即完成背書。不用登入。</div>

  <div id="banner" class="banner" hidden></div>

  <div class="stats">
    <div class="stat dl"><div class="lab">距異議截止</div><div class="val num" id="dl">—</div></div>
    <div class="stat"><div class="lab">已背書</div><div class="val num" id="s-end">0 / 0</div></div>
    <div class="stat"><div class="lab">主負責人已確認項目</div><div class="val num" id="s-ok">0 / 0</div></div>
    <div class="stat"><div class="lab">有異議的項目</div><div class="val num" id="s-obj">0</div></div>
  </div>

  <div class="cols">
    <div class="left" id="secs"></div>

    <aside class="right">
      <section class="sec">
        <div class="shead"><h2>全科同仁背書</h2><span class="r">點自己的名字</span></div>
        <div style="padding:12px 16px;display:grid;gap:12px">
          <div class="names" id="names"></div>
          <div class="other">名單沒有你:<input id="othername" placeholder="輸入姓名" autocomplete="off"><button class="btn sm" id="otherbtn" type="button">背書</button></div>
          <div class="confirm" id="confirm" hidden>
            <div id="confirm-text"></div>
            <div class="row"><button class="btn primary sm" id="confirm-yes" type="button">是,本人已閱,同意刊登</button><button class="btn sm" id="confirm-no" type="button">取消</button></div>
          </div>
        </div>
      </section>

      <section class="sec">
        <div class="shead"><h2>統計</h2><button class="btn sm" id="csv" type="button">匯出 CSV</button></div>
        <div style="padding:12px 16px;display:grid;gap:12px">
          <div><h3>尚未背書</h3><div id="st-pending" class="pending">—</div></div>
          <div><h3>異議清單</h3><div id="st-obj" class="pending">—</div></div>
          <div><h3>各段確認狀況</h3><table class="stat" id="st-sec"></table></div>
        </div>
      </section>
    </aside>
  </div>

  <p class="foot">本頁記錄姓名、身分、時間與回應內容,不記錄其他個人資料;回應只能新增不能修改,寫錯請再新增一筆說明。主負責人與名單由科內後台設定檔決定。</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const PAGE="hemonc-feature-2026";
const DEADLINE="2026-10-21T12:00:00+08:00";
const DEFAULT_ROSTER=["林振源","葉士芃","邱昌芳","白禮源","謝清昀","陳姿婷","連銘渝","林精湛","蔡明宏"];
const SECS=[
 {id:"text",name:"刊登文字",items:[
  {id:"t1",code:"主標",txt:"血液與實體腫瘤精準治療暨細胞治療",src:"定案 2026-10-18"},
  {id:"t2",code:"摘要",txt:"整合血液惡性疾病與實體腫瘤照護,以分子檢測與基因分析選擇標靶、免疫與細胞治療;造血幹細胞移植、CAR-T 與 Phase I 臨床試驗銜接常規治療與創新療法。",src:"定案 2026-10-18"},
  {id:"t3",code:"特色說明",txt:"涵蓋白血病、淋巴瘤、多發性骨髓瘤等血液惡性疾病,以及食道癌、頭頸癌、甲狀腺癌、乳癌、消化道癌與骨肉瘤等實體腫瘤,以分子與基因檢測擬定個人化治療。為中南部主要造血幹細胞移植中心之一,提供半相合、CD45RA 細胞減除式與全髓淋巴放射式移植;細胞治療涵蓋健保給付 CAR-T 與 CIK;持續引進 Phase I 與國際多中心臨床試驗。治療方案由多專科團隊會議決策,結合 AI 輔助化療照護與移植後免疫重建監測。",src:"原官網「中南部最多」「CD45RA 全台獨有」「TMLI 全台最多」三句因無公開數據不沿用;移植團隊提供年例數與一年存活率可改回"}
 ]},
 {id:"kpi",name:"臨床成效",items:[
  {id:"k41",code:"4-1",txt:"自 2023 年 11 月起為健保署核准施行 CAR-T(Kymriah)治療之醫院,治療急性淋巴性白血病與瀰漫性大 B 細胞淋巴瘤,並有實際治療成功案例。",src:"健保署核准名單報導 2023/11;本院新聞稿"},
  {id:"k42",code:"4-2",txt:"細胞治療(CIK/DC-CIK 等)自特管辦法公布至 2024 年 11 月累計 783 人簽署同意接受治療。",src:"本院細胞治療中心頁面,院方統計"},
  {id:"k43",code:"4-3",txt:"2021–2026 年本科醫師以第一或通訊作者於移植專業期刊發表造血幹細胞移植臨床研究,並參與 Lancet Oncol、JCO、NEJM 刊登之國際多中心第三期試驗。",src:"PubMed 逐篇核對"},
  {id:"k44",code:"4-4",txt:"移植年例數、一年存活率、進行中臨床試驗件數:向品管室與試驗中心索取,到位即補入,未到位不等。",src:"院內數字"}
 ]},
 {id:"pub",name:"代表性論文(列名者請確認同意刊出與角色寫法)",items:[
  {id:"p51",code:"5-1",txt:"RATIONALE-306 食道鱗癌一線 phase 3,Lancet Oncol 2023。本科林振源合著。",src:"DOI 10.1016/S1470-2045(23)00108-0,PMID 37080222"},
  {id:"p52",code:"5-2",txt:"半相合移植 ATG+PTCy GVHD 預防,Int J Hematol 2022。本科陳姿婷第一作者、葉士芃通訊作者。",src:"DOI 10.1007/s12185-021-03280-x,PMID 35226308"},
  {id:"p53",code:"5-3",txt:"頭頸鱗癌 Rituximab+化療 Phase I 試驗,BMC Cancer 2022。本科自主主導,謝清昀第一作者、林精湛通訊作者。",src:"DOI 10.1186/s12885-022-09258-0,PMID 35168547"},
  {id:"p54",code:"5-4",txt:"Zanidatamab+Tislelizumab Phase Ib/II HER2+ 胃癌,Clin Cancer Res 2026。本科白禮源第二作者。",src:"DOI 10.1158/1078-0432.CCR-24-4295,PMID 41324998;是否為台灣 site PI 請白醫師確認"},
  {id:"p55",code:"5-5",txt:"局部晚期食道鱗癌化療加減放療有效性:全國性 target trial emulation,Anticancer Res 2026。本科林振源第一作者。",src:"DOI 10.21873/anticanres.18217,PMID 42203356"}
 ]},
 {id:"award",name:"國際認證與獲獎",items:[
  {id:"a61",code:"6-1",txt:"2026 年通過美國 AABB 細胞治療國際認證(2026 年 2 月公告)。",src:"八家媒體報導一致,2026/2/25"},
  {id:"a62",code:"6-2",txt:"2026 年入選 Newsweek「Asia-Pacific's Best Specialized Hospitals 2026」Oncology 類,不列名次。",src:"本院 2026/6/18 公告;正式通知函向公關室索取中"},
  {id:"a63",code:"6-3",txt:"2023 年起為健保署核准施行 CAR-T 細胞治療之醫院。",src:"健保署核准名單報導 2023/11"},
  {id:"a64",code:"6-x",txt:"國家品質標章「全方位造血幹細胞移植團隊」「建構國際一流血液惡性腫瘤治療中心」:查不到得獎年度與等級,暫不列。科秘查到年度即補入。",src:"snq.org.tw 未能定位年度"}
 ]},
 {id:"other",name:"圖片與就醫指引",items:[
  {id:"o7",code:"7",txt:"圖片 10/30 另交。規劃三張:移植病房或細胞處理、多專科團隊討論、臨床試驗中心作業,皆不含病人可辨識資訊。",src:"公關室規格 ≥1280×720,英文頁圖內不得有中文字"},
  {id:"o8",code:"8",txt:"團隊與就醫指引指向官網既有「團隊介紹」「服務項目」頁面,不另寫電話。",src:"官網 depid=60"}
 ]}
];
const ALL=SECS.flatMap(s=>s.items.map(i=>({...i,sec:s.id})));
let cfg={lead:{},roster:DEFAULT_ROSTER,leadNote:""};
let rows=[]; let db=null; let pendingName=null;

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function banner(msg,ok){ const b=document.getElementById("banner"); b.textContent=msg; b.className="banner"+(ok?" ok":""); b.hidden=!msg; }
function renderDeadline(){
  const ms=new Date(DEADLINE)-Date.now(); const el=document.getElementById("dl");
  if(ms<=0){ el.textContent="已截止"; return; }
  const h=Math.floor(ms/3600000), d=Math.floor(h/24);
  el.textContent= d>=1 ? `${d} 天 ${h-d*24} 小時` : `${h} 小時`;
}
function fmt(ts){ try{ const d=ts&&ts.toDate?ts.toDate():null; return d?d.toLocaleString("zh-TW",{timeZone:"Asia/Taipei",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false}):""; }catch(e){ return ""; } }
function leadOf(secId){ return (cfg.lead&&cfg.lead[secId])||""; }

function renderStatic(){
  document.getElementById("today").textContent=new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Taipei"});
  renderDeadline(); setInterval(renderDeadline,60000);
  document.getElementById("secs").innerHTML=SECS.map(s=>`<section class="sec"><div class="shead"><h2>${esc(s.name)}</h2><span class="r" id="lead-${s.id}"></span></div>${s.items.map(it=>`
    <div class="item" id="it-${it.id}">
      <div class="code">${esc(it.code)}</div>
      <div class="txt">${esc(it.txt)}</div>
      <div class="src">來源:${esc(it.src)}</div>
      <div class="acts">
        <button class="btn sm ok" type="button" data-id="${it.id}" data-s="ok" id="ok-${it.id}">✓ 確認無誤</button>
        <button class="btn sm obj" type="button" data-id="${it.id}" data-s="objection">✗ 有異議</button>
        <span class="tally" id="tl-${it.id}"></span>
      </div>
      <div class="who" id="who-${it.id}" hidden></div>
      <textarea class="note" id="nt-${it.id}" placeholder="寫一句:哪裡要改、改成什麼,然後再按一次「有異議」送出" hidden></textarea>
      <div id="rs-${it.id}"></div>
    </div>`).join("")}</section>`).join("");
  document.getElementById("secs").addEventListener("click",async e=>{
    const b=e.target.closest("button.btn"); if(!b||b.disabled) return;
    const id=b.dataset.id, s=b.dataset.s, it=ALL.find(x=>x.id===id), ta=document.getElementById("nt-"+id), who=document.getElementById("who-"+id);
    if(s==="objection" && ta.hidden){ ta.hidden=false; who.hidden=false; who.innerHTML=whoPicker(id); ta.focus(); return; }
    if(s==="ok" && who.hidden){ who.hidden=false; who.innerHTML=whoPicker(id,true); return; }
    const sel=document.getElementById("whosel-"+id); const name=(sel&&sel.value.trim())||"";
    if(!name){ banner("請先選或填確認人姓名。",false); return; }
    const lead=leadOf(it.sec); const role= name===lead ? "主負責人" : "同仁";
    const note=s==="objection"?ta.value.trim():"";
    if(s==="objection" && !note){ banner("請先寫一句異議內容。",false); ta.focus(); return; }
    await submit(id,s,note,name,role,b);
    ta.value=""; ta.hidden=true; who.hidden=true;
  });
  document.getElementById("secs").addEventListener("click",e=>{ const c=e.target.closest("button.whoc"); if(!c) return; const inp=document.getElementById("whosel-"+c.dataset.id); inp.value=c.dataset.n; inp.dispatchEvent(new Event("change")); });

  document.getElementById("names").addEventListener("click",e=>{
    const n=e.target.closest("button.name"); if(!n) return;
    askEndorse(n.dataset.n);
  });
  document.getElementById("otherbtn").addEventListener("click",()=>{ const v=document.getElementById("othername").value.trim(); if(!v){ banner("請輸入姓名。",false); return; } askEndorse(v); });
  document.getElementById("confirm-no").addEventListener("click",()=>{ pendingName=null; document.getElementById("confirm").hidden=true; });
  document.getElementById("confirm-yes").addEventListener("click",async e=>{ if(!pendingName) return; await submit("all","endorse","",pendingName,"同仁",e.currentTarget); pendingName=null; document.getElementById("confirm").hidden=true; });
  document.getElementById("csv").addEventListener("click",exportCsv);
}
function whoPicker(id,isOk){
  const lead=leadOf(ALL.find(x=>x.id===id).sec);
  const names=[...new Set([lead,...cfg.roster].filter(Boolean))];
  return `<div>${isOk?"確認人":"異議人"}:<input id="whosel-${id}" list="roster-list" value="${esc(lead)}" placeholder="姓名" autocomplete="off" style="font:inherit;font-size:14px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;width:130px;background:var(--surface);color:var(--ink)"> ${lead?`<span class="leadtag">主負責人 ${esc(lead)}</span>`:""} 然後再按一次按鈕送出。</div>`;
}
function askEndorse(name){
  const already=rows.some(r=>r.item==="all"&&r.state==="endorse"&&r.name===name);
  pendingName=name;
  document.getElementById("confirm-text").textContent= already ? `${name} 已背書過。要再記錄一次嗎?` : `以「${name}」的名義記錄:本人已閱上列刊登內容,同意刊登。`;
  document.getElementById("confirm").hidden=false;
  document.getElementById("confirm").scrollIntoView({block:"nearest"});
}
async function submit(item,state,note,name,role,btn){
  if(!db){ banner("尚未連上資料庫,請重新整理後再試。",false); return; }
  btn.disabled=true;
  try{
    await addDoc(collection(db,"web_review"),{page:PAGE,item,name,role,state,note,ts:serverTimestamp()});
    banner(state==="endorse"?`已記錄:${name} 背書。`:`已記錄:${name} 對 ${item} 的回應。`,true);
  }catch(err){ banner("送出失敗:"+(err.code||err.message)+"。若在院內網路受限,請改回信。",false); }
  btn.disabled=false;
}
function renderConfig(){
  for(const s of SECS){ const l=leadOf(s.id); document.getElementById("lead-"+s.id).innerHTML= l?`<span class="leadtag">主負責人 ${esc(l)}</span>`:`<span class="r">主負責人待指定</span>`; }
  if(cfg.leadNote){ document.getElementById("how").innerHTML=`<b>怎麼用</b>:${esc(cfg.leadNote)}`; }
  let dl=document.getElementById("roster-list"); if(!dl){ dl=document.createElement("datalist"); dl.id="roster-list"; document.body.appendChild(dl); }
  dl.innerHTML=cfg.roster.map(n=>`<option value="${esc(n)}">`).join("");
}
function renderState(){
  const byItem={}; const endorsers=new Map();
  for(const r of rows){ if(r.item==="all"&&r.state==="endorse"){ if(!endorsers.has(r.name)) endorsers.set(r.name,r); continue; } (byItem[r.item]=byItem[r.item]||[]).push(r); }
  let okItems=0,objItems=0; const objList=[]; const secStat={};
  for(const it of ALL){
    const list=byItem[it.id]||[]; const lead=leadOf(it.sec);
    const leadOk=list.some(r=>r.state==="ok"&&(!lead||r.name===lead));
    const nOk=list.filter(r=>r.state==="ok").length, nObj=list.filter(r=>r.state==="objection").length;
    if(nObj){ objItems++; list.filter(r=>r.state==="objection").forEach(r=>objList.push({it,r})); } else if(leadOk) okItems++;
    secStat[it.sec]=secStat[it.sec]||{n:0,ok:0,obj:0}; secStat[it.sec].n++; if(leadOk&&!nObj) secStat[it.sec].ok++; if(nObj) secStat[it.sec].obj++;
    document.getElementById("ok-"+it.id).classList.toggle("done",leadOk&&!nObj);
    document.getElementById("tl-"+it.id).innerHTML=(nOk?`<span class="chip ok">確認 ${nOk}</span>`:"")+(nObj?`<span class="chip obj">異議 ${nObj}</span>`:"")+(!nOk&&!nObj?`<span class="chip">尚無回應</span>`:"");
    const rs=document.getElementById("rs-"+it.id); rs.innerHTML="";
    for(const r of list){ const d=document.createElement("div"); d.className="resp"+(r.state==="objection"?" obj":""); d.textContent=`${r.name}(${r.role}) · ${r.state==="ok"?"確認無誤":"有異議"}${r.note?":"+r.note:""} · ${fmt(r.ts)}`; rs.appendChild(d); }
  }
  const roster=cfg.roster; const leads=new Set(Object.values(cfg.lead||{}).filter(Boolean));
  document.getElementById("names").innerHTML=roster.map(n=>{ const e=endorsers.get(n); return `<button class="name ${e?"done":""} ${leads.has(n)?"lead":""}" type="button" data-n="${esc(n)}">${esc(n)}<small>${e?"已背書 "+fmt(e.ts):(leads.has(n)?"主負責人":"點我背書")}</small></button>`; }).join("");
  const extra=[...endorsers.keys()].filter(n=>!roster.includes(n));
  document.getElementById("s-end").textContent=`${[...endorsers.keys()].filter(n=>roster.includes(n)).length} / ${roster.length}`+(extra.length?` +${extra.length}`:"");
  document.getElementById("s-ok").textContent=`${okItems} / ${ALL.length}`;
  document.getElementById("s-obj").textContent=objItems;
  const pend=roster.filter(n=>!endorsers.has(n));
  document.getElementById("st-pending").textContent= pend.length? pend.join("、") : "全員已背書";
  document.getElementById("st-obj").innerHTML= objList.length? objList.map(({it,r})=>`<div class="resp obj">${esc(it.code)} ${esc(r.name)}:${esc(r.note)} · ${fmt(r.ts)}</div>`).join("") : "無";
  document.getElementById("st-sec").innerHTML=`<tr><th>段落</th><th>主負責人</th><th>確認/項目</th><th>異議</th></tr>`+SECS.map(s=>{ const st=secStat[s.id]||{n:s.items.length,ok:0,obj:0}; return `<tr><td>${esc(s.name.split("(")[0])}</td><td>${esc(leadOf(s.id)||"—")}</td><td class="num">${st.ok} / ${st.n}</td><td class="num">${st.obj}</td></tr>`; }).join("");
}
function exportCsv(){
  const head=["時間","項目","姓名","身分","回應","備註"];
  const lines=[head.join(",")].concat(rows.map(r=>[fmt(r.ts),r.item,r.name,r.role,r.state,(r.note||"").replace(/[\r\n,]/g," ")].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")));
  const blob=new Blob(["﻿"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`hemonc_web_review_${new Date().toISOString().slice(0,10)}.csv`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}

renderStatic(); renderConfig(); renderState();
fetch("config.json?v="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{ if(j){ cfg={lead:j.lead||{},roster:(Array.isArray(j.roster)&&j.roster.length)?j.roster:DEFAULT_ROSTER,leadNote:j.leadNote||""}; renderConfig(); renderState(); } }).catch(()=>{});
try{
  const app=initializeApp({apiKey:"AIzaSyB12T-DIgrwzPQQJjF3SvkjKnRYy0CxTd8",authDomain:"assistant-hub-cmuh.firebaseapp.com",projectId:"assistant-hub-cmuh",appId:"1:704995456524:web:111c2db8d85a073c8f2029"});
  db=getFirestore(app);
  onSnapshot(query(collection(db,"web_review"),orderBy("ts","asc")),snap=>{ rows=snap.docs.map(d=>d.data()).filter(r=>r.page===PAGE); renderState(); },
    err=>{ banner("讀取回應失敗:"+(err.code||err.message)+"。可照常閱讀內容;有意見請回信。",false); });
}catch(e){ banner("資料庫未載入,可照常閱讀內容;有意見請回信。",false); }
</script>
